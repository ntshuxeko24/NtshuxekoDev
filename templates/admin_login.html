
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>NtshuxekoDev | Admin Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

    <!-- ============================= -->
    <!-- LOGIN PAGE -->
    <!-- ============================= -->

    <main class="page">

        <section class="page-header">

            <p class="section-label">
                NtshuxekoDev
            </p>

            <h1>Admin Login</h1>

            <p>
                Sign in to access the customer enquiry dashboard.
            </p>

        </section>


        <!-- ============================= -->
        <!-- LOGIN FORM -->
        <!-- ============================= -->

        <section class="contact-container">

            <div class="contact-form-container">

                <h2>Sign In</h2>

                <form method="POST"
                      action="/admin-login">

                    <div class="form-group">

                        <label for="username">
                            Username
                        </label>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Enter username"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter password"
                            required>

                    </div>


                    <button
                        type="submit"
                        class="btn primary">

                        Login

                    </button>

                </form>

            </div>

        </section>

    </main>


    <!-- ============================= -->
    <!-- FOOTER -->
    <!-- ============================= -->

    <footer class="footer">

        <p>
            &copy;
            <span id="year"></span>
            NtshuxekoDev. All rights reserved.
        </p>

    </footer>


    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
